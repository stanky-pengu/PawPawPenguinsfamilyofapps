name: Penguin Calculator Android Build

on:
  push:
    paths:
      - 'Penguincalculator/**'
      - '.github/workflows/android-penguin-calculator.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p Penguincalculator test assembleDebug
      - name: Run source arithmetic tests
        run: |
          mkdir -p /tmp/penguin-calc-classes
          javac -d /tmp/penguin-calc-classes Penguincalculator/app/src/main/java/com/pawpawpenguins/calculator/CalculatorEngine.java Penguincalculator/tools/EngineSmokeTest.java
          java -cp /tmp/penguin-calc-classes EngineSmokeTest
      - uses: actions/upload-artifact@v4
        with:
          name: PenguinCalculator-1.1.2-debug
          path: Penguincalculator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
