name: PawPawPenguins Phone Cleaner Android Build

on:
  push:
    paths:
      - 'apps/PawPawPenguinsPhoneCleaner/**'
      - '.github/workflows/android-phone-cleaner.yml'
  pull_request:
    paths:
      - 'apps/PawPawPenguinsPhoneCleaner/**'
      - '.github/workflows/android-phone-cleaner.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run Android unit tests and assemble APK
        run: gradle -p apps/PawPawPenguinsPhoneCleaner test assembleDebug
      - name: Run source checks
        run: python3 apps/PawPawPenguinsPhoneCleaner/tools/source_checks.py
      - uses: actions/upload-artifact@v4
        with:
          name: PawPawPenguins-Phone-Cleaner-1.0.0-debug
          path: apps/PawPawPenguinsPhoneCleaner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
