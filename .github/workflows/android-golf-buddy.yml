name: Build Golf Buddy APK
on:
  push:
    branches: [main]
    paths:
      - 'PawPawPenguinsGolfBuddy/**'
      - '.github/workflows/android-golf-buddy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          packages: 'platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle -p PawPawPenguinsGolfBuddy/android --no-daemon assembleDebug --stacktrace
      - name: Prepare downloadable APK
        run: cp PawPawPenguinsGolfBuddy/android/app/build/outputs/apk/debug/app-debug.apk PawPawPenguinsGolfBuddy-0.2.1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PawPawPenguinsGolfBuddy-0.2.1-debug
          path: PawPawPenguinsGolfBuddy-0.2.1-debug.apk
          if-no-files-found: error
