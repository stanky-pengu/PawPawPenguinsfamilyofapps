name: Android build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run source checks and save JSONL log
        run: set -o pipefail; python3 apps/PawPawPenguinsAlarm/tools/source_checks.py | tee apps/PawPawPenguinsAlarm/source-check.log
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK and accept its license terms
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'true'
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools emulator'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Run JVM tests and build APKs
        run: set -o pipefail; gradle -p apps/PawPawPenguinsAlarm --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest bundleRelease --stacktrace 2>&1 | tee apps/PawPawPenguinsAlarm/build-test.log
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            bash -eo pipefail -c 'cd apps/PawPawPenguinsAlarm && gradle installDebug && adb shell appops set com.pawpawpenguins.alarmclock SCHEDULE_EXACT_ALARM allow && (adb shell pm grant com.pawpawpenguins.alarmclock android.permission.POST_NOTIFICATIONS || true) && (gradle connectedDebugAndroidTest --stacktrace 2>&1 | tee -a build-test.log)'
      - name: Save test logs, reports, and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PawPawPenguinsAlarm-${{ github.run_number }}
          path: |
            apps/PawPawPenguinsAlarm/source-check.log
            apps/PawPawPenguinsAlarm/build-test.log
            apps/PawPawPenguinsAlarm/app/build/reports/tests/
            apps/PawPawPenguinsAlarm/app/build/outputs/androidTest-results/
            apps/PawPawPenguinsAlarm/app/build/outputs/apk/debug/app-debug.apk
            apps/PawPawPenguinsAlarm/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
