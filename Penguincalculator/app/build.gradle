plugins {
    id 'com.android.application'
}

def sceneBase64 = file('src/main/res/drawable-nodpi/math_classroom_scene.jpg.base64')
def sceneJpeg = file('src/main/res/drawable-nodpi/math_classroom_scene.jpg')

tasks.register('decodeMascotScene') {
    inputs.file(sceneBase64)
    outputs.file(sceneJpeg)
    doLast {
        sceneJpeg.bytes = java.util.Base64.decoder.decode(sceneBase64.text.trim())
    }
}

tasks.named('preBuild').configure {
    dependsOn('decodeMascotScene')
}

android {
    namespace 'com.pawpawpenguins.calculator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pawpawpenguins.calculator'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '1.1.4'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
    testImplementation 'junit:junit:4.13.2'
}

