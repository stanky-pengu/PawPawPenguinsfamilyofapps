<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123d35"><meta name="description" content="An easy, offline golf scorecard from PawPawPenguins.">
<title>PawPawPenguins Golf Buddy</title>
<style>
:root{--green:#123d35;--green2:#1d6652;--mint:#dff2e8;--cream:#faf8ef;--ink:#17342e;--muted:#73847d;--line:#e5e9df;--gold:#efc75e;--white:#fff;--shadow:0 18px 50px #15372d18}*{box-sizing:border-box}body{margin:0;background:#f1f5ed;color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;background:var(--cream);box-shadow:var(--shadow);padding-bottom:32px}.top{background:linear-gradient(145deg,#123d35,#1f6c53);color:white;padding:22px 20px 25px;border-radius:0 0 28px 28px}.brand{display:flex;align-items:center;gap:14px}.mascot{width:78px;height:88px;flex:none}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:800;color:#cde9da}.brand h1{font-size:25px;line-height:1.05;margin:5px 0 7px;letter-spacing:-.04em}.brand p{margin:0;color:#e1efe7;font-size:13px}.roundbar{display:flex;gap:9px;margin-top:20px}.roundbar input{min-width:0;flex:1;border:1px solid #ffffff35;background:#ffffff15;color:white;border-radius:13px;padding:12px 13px;outline:none}.roundbar input::placeholder{color:#d6e6df}.select{border:1px solid #ffffff35;background:#164b3f;color:#fff;border-radius:13px;padding:0 12px}.content{padding:18px 16px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 6px 22px #183d3110;margin-bottom:14px}.summary{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}.summary h2{font-size:18px;margin:0 0 3px}.sub{font-size:12px;color:var(--muted)}.score-pill{display:grid;place-items:center;min-width:72px;height:72px;border-radius:50%;background:var(--mint);color:var(--green);font-size:25px;font-weight:850}.score-pill small{font-size:9px;text-transform:uppercase;letter-spacing:.1em;margin-top:-8px;color:var(--green2)}.totals{display:flex;gap:8px;margin-top:14px}.total{flex:1;padding:10px 11px;border-radius:13px;background:#f5f8f3}.total b{display:block;font-size:20px}.total span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.holehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.holehead h2{font-size:17px;margin:0}.hole-num{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--green2);background:var(--mint);padding:6px 10px;border-radius:99px}.stepper{display:flex;align-items:center;justify-content:space-between;gap:8px}.step{border:0;background:#f2f6f0;color:var(--green);width:48px;height:48px;border-radius:15px;font-size:23px;font-weight:750}.step:active,.nav button:active{transform:scale(.96)}.hole-values{display:flex;flex:1;justify-content:center;gap:23px;text-align:center}.hole-values strong{display:block;font-size:27px;line-height:1.1}.hole-values small{color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}.hole-footer{display:flex;gap:9px;margin-top:13px}.softbtn,.primary{border:0;border-radius:13px;padding:12px 14px;font-weight:750}.softbtn{background:#f4f6f0;color:var(--green);flex:1}.primary{background:var(--green);color:white;width:100%;box-shadow:0 8px 18px #123d3523}.scorecard-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.scorecard-title h2{font-size:17px;margin:0}.scorecard-title button{border:0;background:transparent;color:var(--green2);font-size:12px;font-weight:800}.tablewrap{overflow:auto;margin:0 -4px}.cardtable{width:100%;border-collapse:separate;border-spacing:3px;min-width:450px;text-align:center;font-size:12px}.cardtable th{color:var(--muted);font-size:10px;font-weight:750;padding:7px 3px}.cardtable td{background:#f5f8f3;border-radius:9px;height:35px;font-weight:800}.cardtable td.current{outline:2px solid var(--green2);background:var(--mint);color:var(--green)}.cardtable td.done{background:#e8f5eb}.hole-chip{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:50%;background:#edf1e9;color:var(--ink)}.hole-chip.par{background:#e4f1e8}.hole-chip.birdie{background:var(--gold);color:#423711}.hole-chip.eagle{background:#f4d2c4;color:#71321d}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions .primary{grid-column:1/-1}.notice{text-align:center;color:var(--muted);font-size:11px;padding:4px 18px 0}.modal{position:fixed;inset:0;background:#09231dcc;display:none;align-items:end;justify-content:center;padding:12px;z-index:5}.modal.show{display:flex}.sheet{width:min(100%,720px);background:var(--cream);border-radius:23px 23px 18px 18px;padding:20px;max-height:85vh;overflow:auto}.sheet h2{margin:0 0 14px}.savedrow{display:flex;justify-content:space-between;align-items:center;padding:12px;background:white;border-radius:13px;margin:8px 0}.savedrow button{border:0;background:var(--mint);color:var(--green);padding:8px 11px;border-radius:10px;font-weight:700}.close{width:100%;margin-top:12px}.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#193e35;color:#fff;padding:11px 16px;border-radius:99px;font-size:13px;transition:.22s;z-index:8}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:600px){.app{margin:20px auto;border-radius:28px;overflow:hidden;min-height:calc(100vh - 40px)}.content{padding:22px}.top{padding:25px 26px 27px}}
</style></head>
<body><main class="app">
<header class="top"><div class="brand"><svg class="mascot" viewBox="0 0 100 112" role="img" aria-label="Cartoon penguin holding a golf club"><ellipse cx="50" cy="105" rx="34" ry="5" fill="#0a3027" opacity=".3"/><path d="M18 48C18 21 31 8 51 8s33 15 33 41v33c0 16-13 24-34 24S16 96 16 81z" fill="#122d31"/><ellipse cx="50" cy="57" rx="24" ry="31" fill="#fffdf6"/><ellipse cx="40" cy="39" rx="3.4" ry="4.3" fill="#122d31"/><ellipse cx="60" cy="39" rx="3.4" ry="4.3" fill="#122d31"/><path d="M44 48q6-5 12 0l-6 7z" fill="#f0b940"/><path d="M18 52q-16 7-10 21 5 9 18 4m58-23q16 8 10 21-5 9-18 4" fill="none" stroke="#122d31" stroke-width="9" stroke-linecap="round"/><path d="M43 88q-4 9-13 13m29-13q4 9 13 13" fill="none" stroke="#f3bb46" stroke-width="7" stroke-linecap="round"/><path d="M77 27 38 83" stroke="#d3e3dc" stroke-width="3.5" stroke-linecap="round"/><path d="M33 81q-2 10 10 10" fill="none" stroke="#d3e3dc" stroke-width="4" stroke-linecap="round"/><path d="M7 71q4 2 8 0" stroke="#f3bb46" stroke-width="7" stroke-linecap="round"/></svg><div><div class="eyebrow">PawPawPenguins</div><h1>Golf Buddy</h1><p>Your friendly scorecard, right in your pocket.</p></div></div>
<div class="roundbar"><input id="course" maxlength="40" placeholder="Course name" aria-label="Course name"><select id="holesSelect" class="select" aria-label="Round length"><option value="18">18 holes</option><option value="9">9 holes</option></select></div></header>
<section class="content">
<section class="panel summary"><div><h2 id="roundTitle">Your round</h2><div class="sub" id="roundDate"></div><div class="totals"><div class="total"><b id="totalStrokes">0</b><span>Strokes</span></div><div class="total"><b id="totalPar">0</b><span>Par</span></div><div class="total"><b id="toPar">—</b><span>To par</span></div></div></div><div class="score-pill"><span id="bigScore">—</span><small>score</small></div></section>
<section class="panel"><div class="holehead"><h2>Hole score</h2><span id="holeNum" class="hole-num">HOLE 1 OF 18</span></div><div class="stepper"><button class="step" id="prevHole" aria-label="Previous hole">‹</button><div class="hole-values"><div><strong id="strokesVal">4</strong><small>strokes</small></div><div><strong id="parVal">4</strong><small>par</small></div></div><button class="step" id="nextHole" aria-label="Next hole">›</button></div><div class="hole-footer"><button class="softbtn" id="minus">− Stroke</button><button class="softbtn" id="plus">+ Stroke</button></div><div class="hole-footer"><button class="softbtn" id="minusPar">− Par</button><button class="softbtn" id="plusPar">+ Par</button></div><div style="margin-top:12px"><button class="primary" id="saveHole">Save score & next hole</button></div></section>
<section class="panel"><div class="scorecard-title"><h2>Scorecard</h2><button id="saveRound">Save round</button></div><div class="tablewrap"><table class="cardtable" id="scorecard" aria-label="Round scorecard"></table></div></section>
<section class="panel actions"><button class="softbtn" id="savedBtn">Saved rounds</button><button class="softbtn" id="shareBtn">Share scorecard</button><button class="primary" id="newRound">Start a new round</button></section>
<div class="notice">Your scores stay on this device. No account or internet connection needed.</div>
</section></main>
<div class="modal" id="modal"><div class="sheet"><h2>Saved rounds</h2><div id="savedList"></div><button class="softbtn close" id="closeModal">Close</button></div></div><div class="toast" id="toast" role="status"></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),now=new Date(),newGame=(n=18)=>({course:'',holes:n,current:0,pars:Array(n).fill(4),strokes:Array(n).fill(null),date:new Date().toISOString()});let game;try{game=JSON.parse(localStorage.getItem('ppgolf.current'))||newGame()}catch{game=newGame()}if(![9,18].includes(game.holes))game=newGame();const persist=()=>localStorage.setItem('ppgolf.current',JSON.stringify(game));const dateText=()=>new Date(game.date).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});function totals(){let played=game.strokes.reduce((a,x)=>a+(x||0),0),par=game.pars.reduce((a,x,i)=>a+(x||4),0);return{played,par,diff:played?played-game.strokes.reduce((a,x,i)=>a+(x?game.pars[i]:0),0):null}}function render(){game.current=Math.min(Math.max(0,game.current),game.holes-1);$('course').value=game.course;$('holesSelect').value=game.holes;$('roundTitle').textContent=game.course||'Your round';$('roundDate').textContent=dateText();$('holeNum').textContent=`HOLE ${game.current+1} OF ${game.holes}`;$('strokesVal').textContent=game.strokes[game.current]||game.pars[game.current]||4;$('parVal').textContent=game.pars[game.current]||4;let t=totals();$('totalStrokes').textContent=t.played;$('totalPar').textContent=t.par;$('toPar').textContent=t.diff===null?'—':t.diff===0?'E':t.diff>0?`+${t.diff}`:`${t.diff}`;$('bigScore').textContent=t.played||'—';let rows='<tr><th>HOLE</th>'+Array.from({length:game.holes},(_,i)=>`<th>${i+1}</th>`).join('')+'</tr><tr><th>PAR</th>'+game.pars.map((v,i)=>`<td data-i="${i}" class="${i===game.current?'current':''}">${v||4}</td>`).join('')+'</tr><tr><th>SCORE</th>'+game.strokes.map((v,i)=>`<td data-i="${i}" class="${i===game.current?'current ':''}${v?'done':''}">${v?`<span class="hole-chip ${v<game.pars[i]?'birdie':v===game.pars[i]?'par':''}">${v}</span>`:'·'}</td>`).join('')+'</tr>';$('scorecard').innerHTML=rows;document.querySelectorAll('#scorecard td[data-i]').forEach(td=>td.onclick=()=>{game.current=+td.dataset.i;render()});persist()}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1900)}function setScore(d){let i=game.current;game.strokes[i]=Math.max(1,(game.strokes[i]||game.pars[i]||4)+d);render()}function setPar(d){let i=game.current;game.pars[i]=Math.min(6,Math.max(3,(game.pars[i]||4)+d));render()}$('plus').onclick=()=>setScore(1);$('minus').onclick=()=>setScore(-1);$('plusPar').onclick=()=>setPar(1);$('minusPar').onclick=()=>setPar(-1);$('prevHole').onclick=()=>{game.current=(game.current-1+game.holes)%game.holes;render()};$('nextHole').onclick=()=>{game.current=(game.current+1)%game.holes;render()};$('saveHole').onclick=()=>{if(!game.strokes[game.current])game.strokes[game.current]=game.pars[game.current]||4;game.current=Math.min(game.current+1,game.holes-1);render();toast('Score saved')};$('course').oninput=e=>{game.course=e.target.value;render()};$('holesSelect').onchange=e=>{game=newGame(+e.target.value);render();toast('New scorecard ready')};$('saveRound').onclick=()=>{let list=JSON.parse(localStorage.getItem('ppgolf.saved')||'[]');list.unshift({...game,id:Date.now()});localStorage.setItem('ppgolf.saved',JSON.stringify(list.slice(0,30)));toast('Round saved on this device')};$('newRound').onclick=()=>{if(confirm('Start a fresh round? Save this round first if you want to keep it.')){game=newGame(game.holes);render();window.scrollTo({top:0,behavior:'smooth'})}};$('shareBtn').onclick=async()=>{let t=totals(),msg=`${game.course||'Golf round'} — ${t.played} strokes${t.diff===null?'':` (${t.diff===0?'even':t.diff>0?`+${t.diff}`:t.diff} to par)`}\n${game.strokes.map((s,i)=>s?`Hole ${i+1}: ${s}`:null).filter(Boolean).join(' · ')}`;try{if(navigator.share)await navigator.share({title:'My Golf Buddy scorecard',text:msg});else if(navigator.clipboard){await navigator.clipboard.writeText(msg);toast('Scorecard copied to clipboard')}}catch{}};$('savedBtn').onclick=()=>{let list=JSON.parse(localStorage.getItem('ppgolf.saved')||'[]');$('savedList').innerHTML=list.length?list.map(x=>`<div class="savedrow"><div><b>${escapeHTML(x.course||'Golf round')}</b><div class="sub">${new Date(x.date).toLocaleDateString()} · ${x.strokes.reduce((a,v)=>a+(v||0),0)} strokes</div></div><button data-load="${x.id}">Open</button></div>`).join(''):'<p class="sub">No saved rounds yet.</p>';document.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{game=list.find(x=>x.id==b.dataset.load);render();$('modal').classList.remove('show');toast('Round opened')});$('modal').classList.add('show')};$('closeModal').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show');};function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}render()})();
</script></body></html>
